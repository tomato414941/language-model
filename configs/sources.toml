# Pretraining text sources shared by every recipe. Add a source here and use it
# from a recipe's corpus mix; no code change is needed for a new dataset.
#
# Each source reads the files under `prefix` at a pinned dataset commit and keeps
# a document only when every filter passes:
#   equal       field equals the value
#   minimum     numeric field is at least the value
#   maximum     numeric field is at most the value
#   any_minimum at least one listed numeric field reaches its value
# Field names may reach into nested records with dots, such as "meta.name".

[[sources]]
id = "ja-climblab"
language = "ja"
repository = "KantaHayashiAI/ClimbLab-Ja"
revision = "2ed8cdb4a280e5c8875494f30d871db3406922ea"
prefix = "train-"
license = "ODC-By-1.0; source texts CC-BY-4.0, CC-BY-SA-3.0 or ODC-By-1.0"
terms_url = "https://huggingface.co/datasets/KantaHayashiAI/ClimbLab-Ja/blob/main/LICENSES.md"
minimum = { quality = 4, advertisement = 3 }
any_minimum = { informational_value = 4, educational_value = 4, cultural_value = 4, creative_value = 4 }

