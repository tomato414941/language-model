# Questions with answers and reasoning for the phase that lowers the learning
# rate, in the conversation format that instruction tuning reads. Small models
# learn more from short reasoning than from long traces of large models (Li et
# al., "Small Models Struggle to Learn from Strong Reasoners", 2025), so the
# traces are kept to those that fit a 4,096-token window.
[[sources]]
id = "en-reasoning-openmath"
language = "en"
repository = "nvidia/OpenMathReasoning"
revision = "d3d08664755704f422af97d43a7ff0ded4bd95df"
prefix = "data/cot-"
# Solutions written by DeepSeek-R1 and QwQ-32B, whose licenses leave their
# outputs free to use.
license = "CC-BY-4.0"
terms_url = "https://huggingface.co/datasets/nvidia/OpenMathReasoning"
template = "User: {problem}\n\nAssistant: {generated_solution}"
maximum_characters = 12000

