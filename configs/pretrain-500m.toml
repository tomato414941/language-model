training_config = "bilingual-500m.toml"
sources = "sources.toml"
seed = 42

[tokenizer]
vocabulary_size = 32768
bytes_per_language = 67_108_864

[corpus]
validation_tokens_per_language = 5_000_000
validation_fraction = 0.001
minimum_characters = 300
maximum_characters = 100000

[evaluation]
framework = "lm-eval"
version = "0.4.13"
base_tasks = [
    "hellaswag", "arc_easy", "ja_leaderboard_jcommonsenseqa", "sciq", "piqa",
    "lambada_openai", "blimp", "kuci", "ja_leaderboard_xwinograd", "ja_leaderboard_jnli",
]
instruction_tasks = ["ifeval"]

[sft]
epochs = 2
learning_rate = 0.00002
min_learning_rate = 0.000002
batch_size = 4
accumulation_steps = 8
validation_conversations_per_language = 1000
max_reply_tokens = 1024

[[corpora]]
name = "main"
training_tokens = 15_000_000_000
mix = { ja-hq = 45, ja-wiki = 5, en-web = 40, en-math = 5, en-wiki = 5 }
