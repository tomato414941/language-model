# continue-v4's model grown to twice the layers by `pretrain grow`: a new run
# that warms up to continue-v4's peak rate, holds it, and decays over the
# last 2,500 of its 12,500 steps. It evaluates and saves every 1,250 steps,
# which cost about what bilingual-v4-extend.toml's 2,500 do.
[model]
architecture = "llama"
width = 576
heads = 9
kv_heads = 3
layers = 60
intermediate_size = 1536
context = 2048
rope_theta = 10000.0

[training]
steps = 12500
batch_size = 4
accumulation_steps = 4
learning_rate = 0.0004
min_learning_rate = 0.00004
warmup_steps = 500
weight_decay = 0.1
gradient_clip = 1.0
eval_every = 1250
save_every = 1250
eval_batches = 16
log_every = 50
seed = 42
schedule = "wsd"
decay_steps = 2500
sampling = "sequential"
