# The v5 bilingual model, trained from random weights. A stable phase at the
# peak learning rate reads web text, code and mathematics; the phase that
# lowers the rate reads the highest-quality text with questions, answers and
# reasoning, as SmolLM3 and OLMo 3 end their pretraining. Each language takes
# half of the tokens, the share its sources add up to, and training reads the
# languages in that proportion; most code and mathematics sits in the English
# half. Each phase's corpus holds corpus_tokens, of which
# training reads training_tokens, so a smaller budget or a slower model needs
# no new corpus; the stable phase's last checkpoint is where a longer run
# continues.
training_config = "model-v5.toml"
sources = "sources.toml"
seed = 42

[tokenizer]
vocabulary_size = 32768
bytes_per_language = 67_108_864
# GPT-4's pre-tokenization needed 3% fewer tokens than GPT-2's on the catalog's
# held-out text, 5% fewer for code, at no cost to the other languages.
pretokenizer = "gpt4"
reserved_tokens = 256

[corpus]
validation_tokens_per_language = 5_000_000
# No fixed held-out fraction: each phase holds out the share of documents its
# own budgets call for, so both splits fill together. The decay phase holds
# out more of its smaller corpus than the stable phase does.
minimum_characters = 300
maximum_characters = 100000

[evaluation]
framework = "lm-eval"
version = "0.4.13"
base_tasks = [
    "hellaswag", "arc_easy", "ja_leaderboard_jcommonsenseqa", "sciq", "piqa",
    "lambada_openai", "blimp", "kuci", "ja_leaderboard_xwinograd", "ja_leaderboard_jnli",
    "mmlu_continuation", "jmmlu", "arc_challenge", "gsm8k", "ja_leaderboard_mgsm",
    "humaneval", "mbpp", "jhumaneval", "ja_leaderboard_jsquad",
]
instruction_tasks = ["ifeval"]

# Instruction tuning keeps pretraining's optimizer, starts from the rate the
# decay ended at and reads every conversation once per epoch, a step as many
# tokens as pretraining's. Replies that reason first run to a few thousand
# tokens.
[sft]
epochs = 2
learning_rate = 0.00016
min_learning_rate = 0.000016
batch_size = 4
accumulation_steps = 8
optimizer = "muon"
sampling = "sequential"
validation_conversations_per_language = 1000
max_reply_tokens = 4096

# Code about 12% and mathematics about 10%, between SmolLM3's first and
# second stages.
[[corpora]]
name = "stable"
training_tokens = 9_961_472_000
corpus_tokens = 9_961_472_000
mix = { ja-climblab = 42, ja-wiki = 4, ja-math-llmjp = 2, ja-code-llmjp = 2, en-web = 20, en-dclm = 10, en-code-swallow = 5, en-code-stack-edu = 5, en-qa-stackexchange = 2, en-math = 3, en-math-megamath = 3, en-math-swallow-qa = 1, en-math-swallow-textbook = 1 }

[[corpora]]
name = "decay"
training_tokens = 1_782_579_200
corpus_tokens = 1_782_579_200
validation_tokens_per_language = 2_000_000
mix = { ja-climblab-top = 18, ja-wiki = 8, ja-aozora = 2, ja-general-llmjp = 7, ja-reasoning-llmjp = 6, ja-math-llmjp = 5, ja-code-llmjp = 4, en-edu-top = 10, en-wiki = 5, en-cosmopedia = 3, en-code-swallow = 6, en-code-stack-edu = 2, en-math-swallow-qa = 4, en-math-swallow-textbook = 3, en-math = 2, en-reasoning-openmath = 5, en-general-llmjp = 4, en-reasoning-llmjp = 4, en-math-llmjp = 1, en-code-llmjp = 1 }
