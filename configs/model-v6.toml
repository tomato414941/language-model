# The v6 model starts from the v5 model's design, with heads of 128
# dimensions rather than 64: eight query heads and two key-value heads keep
# the width and the key-value width, so only the gates, one per head,
# shrink: 0.2M fewer of about 300M parameters.
# FlashAttention runs faster at that head width, and Marin's and nanochat's
# comparisons found it trained to a lower loss. Value embeddings in every
# other layer, gated, follow nanochat, whose comparisons found that form best.
# Thirty-two layers rather than 24 grow the model by depth, which nanochat
# found better than width at the same compute: about 400M parameters outside
# the value embeddings, the compute-optimal size at the v5 model's compute.
# The training section is the v5 model's until the v6 recipe sets its budget.
[model]
architecture = "llama"
width = 1024
heads = 8
kv_heads = 2
layers = 32
intermediate_size = 2752
context = 8192
rope_theta = 10000.0
qk_norm = true
attention_gate = "headwise"
value_embeddings = true
# The tokenizer's BOS, which begins each document.
document_start = 0

[training]
# 32 windows of 8,192 tokens per update: 262,144 tokens.
steps = 44800
batch_size = 4
accumulation_steps = 8
learning_rate = 0.0016
min_learning_rate = 0.00016
warmup_steps = 1000
weight_decay = 0.1
gradient_clip = 1.0
eval_every = 1000
# About every 8 minutes on an A100, so an interruption loses little.
save_every = 100
eval_batches = 16
log_every = 20
seed = 42
schedule = "wsd"
decay_steps = 6800
decay_shape = "1-sqrt"
sampling = "sequential"
optimizer = "muon"
