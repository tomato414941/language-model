# The v6 model starts from the v5 model's design, with heads of 128
# dimensions rather than 64: eight query heads and two key-value heads keep
# the width and the key-value width, so only the gates, one per head,
# shrink: 0.2M fewer of about 300M parameters.
# FlashAttention runs faster at that head width, and Marin's and nanochat's
# comparisons found it trained to a lower loss. Value embeddings in every
# other layer, gated, follow nanochat, whose comparisons found that form best.
# So do the learned scalars that scale the stream and mix the first layer's
# input back in before each layer, which nanochat and Marin found lowered the
# loss, and the output projections that start at zero.
# Thirty-two layers rather than 24 grow the model by depth, which nanochat
# found better than width at the same compute: about 400M parameters outside
# the value embeddings, the compute-optimal size at the v5 model's compute.
# Training reads about 8.4B tokens, the compute-optimal count for that size,
# in updates of about 1M tokens: nanochat's batch for models trained on 3.4B
# to 9.6B tokens, from the Power Lines law that the best batch grows with the
# tokens read. Its rules carry the v5 model's settings to that batch, four
# times v5's: the learning rate grows with the square root of the batch, to
# twice v5's, and weight decay as much again and by the tokens v5 read over
# these, so the weights forget at the same pace through the run. Warmup keeps
# its share of the run. The rate decays over the last fifth of the run to a
# hundredth of its peak: IMU-1 found a fifth better than a tenth or three
# tenths, and Straight to Zero found decaying to zero better than stopping at
# a tenth. The matrices take NorMuon with cautious weight decay that falls to
# zero over the run, nanochat's optimizer.
[model]
architecture = "llama"
width = 1024
heads = 8
kv_heads = 2
layers = 32
intermediate_size = 2752
context = 8192
rope_theta = 10000.0
qk_norm = true
attention_gate = "headwise"
value_embeddings = true
residual_scalars = true
zero_output_init = true
# The tokenizer's BOS, which begins each document.
document_start = 0

[training]
# 128 windows of 8,192 tokens per update: 1,048,576 tokens; 8,000 updates
# read 8.39B tokens.
steps = 8000
batch_size = 4
accumulation_steps = 32
learning_rate = 0.0032
min_learning_rate = 0.000032
warmup_steps = 180
# 0.1 x 2 x 11.74B / 8.39B.
weight_decay = 0.28
gradient_clip = 1.0
eval_every = 200
save_every = 25
eval_batches = 16
log_every = 5
seed = 42
schedule = "wsd"
decay_steps = 1600
decay_shape = "1-sqrt"
sampling = "sequential"
optimizer = "normuon"
weight_decay_schedule = "cosine"
