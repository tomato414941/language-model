# The base of the small runs with three fifths of every phase in Japanese instead of half, each language's
# sources in about the base's proportions: whether more Japanese helps the two languages' knowledge.
# LLM-jp's questions and answers give way to Hugging Face sets of the same kinds, as LLM-jp's host stopped
# serving them.
training_config = "model.toml"
patch_config = "model-patch.toml"
sources = "../sources.toml"
seed = 42
compile = true

[tokenizer]
vocabulary_size = 32_768
bytes_per_language = 67_108_864
pretokenizer = "gpt4"
single_digits = true
reserved_tokens = 256

[corpus]
validation_tokens_per_language = 5_000_000
minimum_characters = 300
maximum_characters = 100_000

[[corpora]]
name = "patch"
purpose = "patch"
# 6,000 updates of 4 windows of 8,192 patches and the three tokens that let the last patch's next patch fit.
training_tokens = 786_504_000
mix = { ja-climblab = 25, ja-paraphrase-llmjp = 25, ja-wiki = 5, ja-math-swallow = 3, ja-code-swallow = 2, en-finephrase = 2, en-web = 10, en-dclm = 12, en-code-swallow = 4, en-code-stack-edu = 4, en-qa-stackexchange = 2, en-math = 2, en-math-megamath = 2, en-math-swallow-qa = 1, en-math-swallow-textbook = 1 }
quality = { ja-climblab = "quality", en-web = "score", en-dclm = "fasttext_openhermes_reddit_eli5_vs_rw_v2_bigram_200k_train_prob", en-math = "score", en-math-megamath = "math_score" }

[[corpora]]
name = "stable"
# 1,200 updates of 16 windows of 8,192 tokens.
training_tokens = 157_286_400
mix = { ja-climblab = 25, ja-paraphrase-llmjp = 25, ja-wiki = 5, ja-math-swallow = 3, ja-code-swallow = 2, en-finephrase = 2, en-web = 10, en-dclm = 12, en-code-swallow = 4, en-code-stack-edu = 4, en-qa-stackexchange = 2, en-math = 2, en-math-megamath = 2, en-math-swallow-qa = 1, en-math-swallow-textbook = 1 }

[[corpora]]
name = "late"
# 1,080 updates at the full learning rate.
training_tokens = 141_557_760
mix = { ja-climblab-top = 22, ja-wiki = 10, ja-aozora = 2, ja-general-calm3 = 8, ja-stem-swallow = 7, ja-math-swallow = 6, ja-code-swallow = 5, en-ultrafineweb = 8, en-wiki = 4, en-stem-nemotron = 3, en-code-swallow = 6, en-code-stack-edu = 2, en-math-swallow-qa = 4, en-math-swallow-textbook = 2, en-math = 2, en-reasoning-openmath = 6, en-qa-stackexchange = 3 }

[[corpora]]
name = "decay"
# 720 updates while the learning rate decays.
training_tokens = 94_371_840
validation_tokens_per_language = 2_000_000
mix = { ja-climblab-top = 22, ja-wiki = 10, ja-aozora = 2, ja-general-calm3 = 8, ja-stem-swallow = 7, ja-math-swallow = 6, ja-code-swallow = 5, en-ultrafineweb = 8, en-wiki = 4, en-stem-nemotron = 3, en-code-swallow = 6, en-code-stack-edu = 2, en-math-swallow-qa = 4, en-math-swallow-textbook = 2, en-math = 2, en-reasoning-openmath = 6, en-qa-stackexchange = 3 }
