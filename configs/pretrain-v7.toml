# The v7 bilingual model, trained from random weights on v6's recipe for a
# budget of $20 on one RTX 5090, with four changes to what it reads.
# The stable phase's English web text goes back toward v5's: FinePhrase falls
# from half of it to a tenth, and FineWeb-Edu, v5's, takes the rest of that
# half, since English fell below v5 in v6 on the tasks rewriting is not known
# to help. Half of ClimbLab-Ja gives way to LLM-jp's Japanese rewrites of
# Japanese web text (CC BY 4.0), which beat repeating the same web text, or
# adding English, at 1.8B to 7.2B parameters where Japanese text runs short;
# Kang et al. found about a third of rewritten text with web text the best
# share. The decay phase reads Ultra-FineWeb in place of FineWeb-Edu's best,
# above it in its authors' comparisons. And the patches read each source from
# its lowest-scored documents to its highest, as Puro-2B ordered its data,
# every source's same share of its order read together; sources without a
# score keep their written order. The decay phase's documents come in two
# corpora of the same mix, so that the learning rate starts down only with the
# second, the last two fifths of them: at 630M, decaying over the last 40% of
# the switched data lowered its loss by 0.014 to 0.024. RULER's SQuAD and
# HotpotQA questions are left out with the other benchmarks' questions.
training_config = "model-v7.toml"
patch_config = "model-v7-patch.toml"
sources = "sources.toml"
seed = 42
compile = true

[tokenizer]
vocabulary_size = 32768
bytes_per_language = 67_108_864
pretokenizer = "gpt4"
single_digits = true
reserved_tokens = 256

[corpus]
validation_tokens_per_language = 5_000_000
minimum_characters = 300
maximum_characters = 100000

[evaluation]
framework = "lm-eval"
version = "0.4.13"
base_tasks = [
    "hellaswag", "arc_easy", "ja_leaderboard_jcommonsenseqa", "sciq", "piqa",
    "lambada_openai", "blimp", "ja_leaderboard_xwinograd", "ja_leaderboard_jnli",
    "mmlu_continuation", "arc_challenge", "gsm8k", "ja_leaderboard_mgsm",
    "humaneval", "mbpp", "ja_leaderboard_jsquad",
]
instruction_tasks = ["ifeval"]
# llm-jp-eval leaves out JHumanEval, whose processing it does not allow for
# commercial use.
llm_jp_eval_tasks = ["kuci", "jmmlu"]
llm_jp_eval_instruction_tasks = ["mif_eval_ja"]

# Instruction tuning as v6's, until v7's is planned.
[sft]
epochs = 2
learning_rate = 0.00016
min_learning_rate = 0.000016
batch_size = 1
accumulation_steps = 32
eval_batches = 64
optimizer = "normuon"
sampling = "sequential"
validation_conversations_per_language = 1000
max_reply_tokens = 4096

[[corpora]]
name = "patch"
purpose = "patch"
# 6,000 updates of 32 windows of 8,192 patches and the three tokens that let
# the last patch's next patch fit.
training_tokens = 6_292_032_000
mix = { ja-climblab = 21, ja-paraphrase-llmjp = 21, ja-wiki = 4, ja-math-llmjp = 2, ja-code-llmjp = 2, en-finephrase = 3, en-web = 12, en-dclm = 15, en-code-swallow = 5, en-code-stack-edu = 5, en-qa-stackexchange = 2, en-math = 3, en-math-megamath = 3, en-math-swallow-qa = 1, en-math-swallow-textbook = 1 }
# The scores the patches are ordered by: ClimbLab-Ja's quality rating, the
# FineWeb-Edu and FineMath classifiers' scores, DCLM's fastText probability,
# which Luo et al. ordered by, and MegaMath's.
quality = { ja-climblab = "quality", en-web = "score", en-dclm = "fasttext_openhermes_reddit_eli5_vs_rw_v2_bigram_200k_train_prob", en-math = "score", en-math-megamath = "math_score" }

[[corpora]]
name = "stable"
# 1,200 updates.
training_tokens = 1_258_291_200
mix = { ja-climblab = 21, ja-paraphrase-llmjp = 21, ja-wiki = 4, ja-math-llmjp = 2, ja-code-llmjp = 2, en-finephrase = 3, en-web = 12, en-dclm = 15, en-code-swallow = 5, en-code-stack-edu = 5, en-qa-stackexchange = 2, en-math = 3, en-math-megamath = 3, en-math-swallow-qa = 1, en-math-swallow-textbook = 1 }

[[corpora]]
name = "late"
# 1,080 updates of the decay phase's mix at the full learning rate.
training_tokens = 1_132_462_080
mix = { ja-climblab-top = 18, ja-wiki = 8, ja-aozora = 2, ja-general-llmjp = 7, ja-reasoning-llmjp = 6, ja-math-llmjp = 5, ja-code-llmjp = 4, en-ultrafineweb = 10, en-wiki = 5, en-stem-nemotron = 3, en-code-swallow = 6, en-code-stack-edu = 2, en-math-swallow-qa = 4, en-math-swallow-textbook = 3, en-math = 2, en-reasoning-openmath = 5, en-general-llmjp = 4, en-reasoning-llmjp = 4, en-math-llmjp = 1, en-code-llmjp = 1 }

[[corpora]]
name = "decay"
# 720 updates while the learning rate decays.
training_tokens = 754_974_720
validation_tokens_per_language = 2_000_000
mix = { ja-climblab-top = 18, ja-wiki = 8, ja-aozora = 2, ja-general-llmjp = 7, ja-reasoning-llmjp = 6, ja-math-llmjp = 5, ja-code-llmjp = 4, en-ultrafineweb = 10, en-wiki = 5, en-stem-nemotron = 3, en-code-swallow = 6, en-code-stack-edu = 2, en-math-swallow-qa = 4, en-math-swallow-textbook = 3, en-math = 2, en-reasoning-openmath = 5, en-general-llmjp = 4, en-reasoning-llmjp = 4, en-math-llmjp = 1, en-code-llmjp = 1 }
