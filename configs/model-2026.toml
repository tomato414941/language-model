# The 2026 model: rotary attention with normalized queries and keys, a gate
# per head and attention within documents, trained with Muon on a
# warmup-stable-decay schedule. Windows of 8,192 tokens keep whole the
# documents between 4k and 8k, about a seventh of the stable corpus, for about
# 5-10% of an A100's throughput, since attention stays within documents and
# most are shorter; a later phase extends the context further.
[model]
architecture = "llama"
width = 1024
heads = 16
kv_heads = 4
layers = 24
intermediate_size = 2752
context = 8192
rope_theta = 10000.0
qk_norm = true
attention_gate = "headwise"
# The tokenizer's BOS, which begins each document.
document_start = 0

[training]
# 32 windows of 8,192 tokens per update: 262,144 tokens.
steps = 44800
batch_size = 4
accumulation_steps = 8
learning_rate = 0.0016
min_learning_rate = 0.00016
warmup_steps = 1000
weight_decay = 0.1
gradient_clip = 1.0
eval_every = 1000
# About every 8 minutes on an A100, so an interruption loses little.
save_every = 100
eval_batches = 16
log_every = 20
seed = 42
schedule = "wsd"
decay_steps = 6800
decay_shape = "1-sqrt"
sampling = "sequential"
optimizer = "muon"
