[project]
name = "language-model"
version = "0.1.0"
description = "A small character language model trained from scratch in pure Python."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
