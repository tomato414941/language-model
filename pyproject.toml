[project]
name = "language-model"
version = "0.1.0"
description = "Language models trained from scratch, with CPU preparation and GPU pretraining."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
train = ["numpy>=2.2,<3", "tokenizers>=0.22,<1", "torch>=2.6,<3"]
train-cpu = ["numpy>=2.2,<3", "tokenizers>=0.22,<1", "torch>=2.6,<3"]

[tool.uv]
package = false
conflicts = [[{ extra = "train" }, { extra = "train-cpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "train-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]
