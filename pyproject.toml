[project]
name = "language-model"
version = "0.1.0"
description = "Language models trained from scratch, with CPU preparation and GPU pretraining."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
    # The language-model projects' shared evaluation: what a model knows is measured
    # by one of its definitions, and the text that holds a benchmark question is
    # told by its rule.
    "language-model-evaluation",
]

[project.optional-dependencies]
train = ["numpy>=2.2,<3", "tokenizers>=0.22,<1", "torch>=2.14,<3", "fla-core==0.5.2", "torchao==0.18.0"]
# Triton's interpreter runs the experts' kernels on the CPU in the tests.
train-cpu = [
    "numpy>=2.2,<3", "tokenizers>=0.22,<1", "torch>=2.14,<3", "torchao==0.18.0",
    "triton>=3.8,<4; sys_platform == 'linux'",
]
corpus = ["huggingface-hub>=0.35,<2", "pyarrow>=21,<30", "zstandard>=0.23,<1"]
hub = ["huggingface-hub>=0.35,<2"]
serve-huggingface = ["accelerate>=1,<2", "transformers>=5.20,<6"]
deploy = ["modal>=1.6.1,<2"]
eval = [
    "lm-eval[hf,ifeval,ruler]==0.4.13",
    # M-IFEval-Ja's checkers, at the versions M-IFEval pins.
    "janome==0.5.0",
    "ja-sentence-segmenter==0.0.2",
]

[tool.uv]
package = false
conflicts = [[{ extra = "train" }, { extra = "train-cpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "train-cpu" }]
language-model-evaluation = { url = "https://github.com/tomato414941/language-model-evaluation/archive/1d67b43c89dd5fb1044c78f2a651ae7e0901d9ff.zip" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "openai>=2,<4",
]
