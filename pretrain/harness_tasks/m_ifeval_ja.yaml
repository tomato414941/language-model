# M-IFEval-Ja (tokyotech-llm/M-IFEval-Ja): M-IFEval's Japanese instructions
# (Dussolle et al., NAACL 2025) as the Swallow evaluation revised them. The
# harness has no definition of it, so this one asks and scores it as the
# harness's ifeval does, with M-IFEval's own checkers.
task: m_ifeval_ja
dataset_path: json
dataset_kwargs:
  data_files:
    test: https://huggingface.co/datasets/tokyotech-llm/M-IFEval-Ja/resolve/f42d9f0c9bd3e1be76b47c84143cd94d98eada8b/test.jsonl
output_type: generate_until
test_split: test
num_fewshot: 0
doc_to_text: prompt
doc_to_target: 0
generation_kwargs:
  until: []
  do_sample: false
  temperature: 0.0
  max_gen_toks: 1280
process_results: !function m_ifeval_ja.process_results
metric_list:
  - metric: prompt_level_strict_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_strict_acc
    aggregation: !function m_ifeval_ja.agg_inst_level_acc
    higher_is_better: true
  - metric: prompt_level_loose_acc
    aggregation: mean
    higher_is_better: true
  - metric: inst_level_loose_acc
    aggregation: !function m_ifeval_ja.agg_inst_level_acc
    higher_is_better: true
metadata:
  version: 1.0
